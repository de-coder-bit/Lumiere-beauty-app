<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payment Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-[450px]">

    <h1 class="text-2xl font-bold mb-4">
        Lumière Payment Gateway
    </h1>

    <p class="text-gray-600 mb-6">
        Complete your booking payment
    </p>

    <div class="border rounded-lg p-4 mb-4">
        <h2 class="font-semibold">
            Amount
        </h2>

        <p id="amount" class="text-3xl font-bold text-green-600">
            ₹0
        </p>
    </div>

    <div class="space-y-3 mb-6">

        <label class="block border p-3 rounded-lg cursor-pointer">
            <input type="radio" name="payment" checked>
            UPI
        </label>

        <label class="block border p-3 rounded-lg cursor-pointer">
            <input type="radio" name="payment">
            Debit Card
        </label>

        <label class="block border p-3 rounded-lg cursor-pointer">
            <input type="radio" name="payment">
            Credit Card
        </label>

    </div>

    <button
        onclick="completePayment()"
        class="w-full bg-black text-white py-3 rounded-lg">
        Pay Now
    </button>

</div>

<script>

const amount = localStorage.getItem("bookingAmount") || 0;

document.getElementById("amount").innerText = "₹" + amount;

function completePayment() {

    localStorage.setItem(
        "paymentSuccess",
        "true"
    );

    localStorage.setItem(
        "paymentId",
        "PAY_" + Date.now()
    );

    window.location.href =
        "payment-success.html";
}
</script>

</body>
</html>
